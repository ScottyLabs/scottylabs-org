[package]
name = "site"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ammonia = "4"
anyhow = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
cookie = "0.18"
futures = "0.3"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
mime_guess = "2"
openidconnect = { version = "4", default-features = false, features = [
  "reqwest",
  "rustls-tls",
] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
rusty-s3 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "chrono",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "uuid",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
  "fs",
  "limit",
  "set-header",
  "trace",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Declared up front so parallel work does not edit this file; used by the platform, ticker,
# projects and committees tracks. Remove this list once everything is merged.
[package.metadata.cargo-machete]
ignored = [
  "base64",
  "bytes",
  "cookie",
  "futures",
  "http-body-util",
  "image",
  "mime_guess",
  "openidconnect",
  "rand",
  "rusty-s3",
  "serde_norway",
  "sha2",
  "subtle",
  "tower",
]
