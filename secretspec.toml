[project]
name = "scottylabs-org"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"

[defaults]
providers = ["openbao"]

[profiles.default]
PUBLIC_POSTHOG_KEY = { description = "PostHog project API key", required = false }
PUBLIC_POSTHOG_HOST = { description = "PostHog instance host", required = false }
# Written by the governance oidc_client feature. Sign-in with Keycloak turns on once all seven are present; until then the portal offers dev sign-in locally and nothing elsewhere.
OIDC_CLIENT_ID = { description = "Keycloak OIDC client id", required = false }
OIDC_CLIENT_SECRET = { description = "Keycloak OIDC client secret", required = false }
KEYCLOAK_URL = { description = "Keycloak base URL", required = false }
KEYCLOAK_REALM = { description = "Keycloak realm", required = false }
OAUTH_RELAY_URL = { description = "OAuth relay (Ricochet) callback for this environment", required = false }
PROJECT_GROUP = { description = "Keycloak group path for project members", required = false }
PROJECT_ADMIN_GROUP = { description = "Keycloak group path for project admins", required = false }
# Previews and local development only: demo content gives real Andrew IDs persona roles, so long-lived deployments leave it unset.
SEED_DEMO_CONTENT = { description = "Seed sample announcements and dev sign-in personas", required = false }
# Not a secret: lets a deployment turn the governance sync off (0) without a code change. Unset, it is on except in local development.
GOVERNANCE_SYNC = { description = "Sync directors and heads from governance at startup and every six hours (1 or 0)", required = false }

[profiles.prod]
PUBLIC_POSTHOG_KEY = { description = "PostHog project API key", required = true }
PUBLIC_POSTHOG_HOST = { description = "PostHog instance host", required = true }

[profiles.staging]

[profiles.preview]
SEED_DEMO_CONTENT = { description = "Seed sample announcements and dev sign-in personas", required = false, default = "1" }
# Dev sign-in on a preview also needs the key, so a preview without one in OpenBao keeps it off.
PORTAL_DEV_LOGIN = { description = "Allow dev sign-in as a seeded persona (1), with PORTAL_DEV_LOGIN_KEY", required = false, default = "1" }
PORTAL_DEV_LOGIN_KEY = { description = "Shared key that enables dev sign-in on previews (at least 16 characters)", required = false }

# Kennel's long-lived dev branch deployment, and the local site process. Locally, demo content and dev sign-in come from the dev shell's environment instead.
[profiles.dev]

[scopes.public]
secrets = ["PUBLIC_POSTHOG_KEY", "PUBLIC_POSTHOG_HOST"]
