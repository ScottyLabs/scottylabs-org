[project]
name = "scottylabs-org"
revision = "1.0"

[providers]
openbao = "openbao://secrets.scottylabs.org/secret"

[defaults]
providers = ["openbao"]

[profiles.default]
PUBLIC_POSTHOG_KEY = { description = "PostHog project API key", required = false }
PUBLIC_POSTHOG_HOST = { description = "PostHog instance host", required = false }

[profiles.prod]
PUBLIC_POSTHOG_KEY = { description = "PostHog project API key", required = true }
PUBLIC_POSTHOG_HOST = { description = "PostHog instance host", required = true }

[profiles.staging]

[profiles.preview]

[profiles.dev]

[scopes.public]
secrets = ["PUBLIC_POSTHOG_KEY", "PUBLIC_POSTHOG_HOST"]
